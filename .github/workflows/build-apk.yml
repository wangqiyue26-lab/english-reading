name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'css/**'
      - 'js/**'
      - 'index.html'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          ANDROID_HOME=$ANDROID_SDK_ROOT
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "=== Pre-installed ==="
          ls $ANDROID_SDK_ROOT/platforms/ 2>/dev/null || echo "no platforms"
          ls $ANDROID_SDK_ROOT/build-tools/ 2>/dev/null || echo "no build-tools"
          which gradle 2>/dev/null && gradle --version 2>/dev/null || echo "no system gradle"
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" 2>&1

      - name: Download Gradle 8.5
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH
          $PWD/gradle-8.5/bin/gradle --version

      - name: Build APK
        working-directory: android
        run: ../gradle-8.5/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: List APKs
        run: find . -name "*.apk" -ls

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: english-reading-apk
          path: android/app/build/outputs/apk/**/*.apk

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: English Reading v1.0.${{ github.run_number }}
          files: android/app/build/outputs/apk/**/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
