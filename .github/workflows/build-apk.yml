name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'css/**'
      - 'js/**'
      - 'index.html'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          ANDROID_HOME=$ANDROID_SDK_ROOT
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Download Gradle 8.5
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle.zip
          unzip -q gradle.zip

      - name: Build APK
        working-directory: android
        run: ../gradle-8.5/bin/gradle assembleDebug --no-daemon

      - name: Copy APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk english-reading.apk
          ls -la english-reading.apk
          echo "APK_SIZE=$(stat -c%s english-reading.apk)" >> $GITHUB_ENV

      - name: Delete old tag and release
        run: |
          gh release delete v1.0 --yes 2>/dev/null || true
          git push origin :refs/tags/v1.0 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release and Upload APK
        run: |
          gh release create v1.0 english-reading.apk \
            --title "English Reading v1.0" \
            --notes "Android APK — English magazine reader with word lookup, translations, reading progress, streak tracking, vocabulary notebook, and more.

          Download and install on Android 7.0+ devices." \
            --repo ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: english-reading-apk
          path: english-reading.apk
