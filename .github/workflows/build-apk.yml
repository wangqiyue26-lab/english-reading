name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'css/**'
      - 'js/**'
      - 'index.html'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK Tools
        run: |
          ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          # Ubuntu-latest comes with Android SDK partially installed
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" ]; then
            yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
            $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
          elif [ -d "$ANDROID_SDK_ROOT/tools/bin" ]; then
            yes | $ANDROID_SDK_ROOT/tools/bin/sdkmanager --licenses
            $ANDROID_SDK_ROOT/tools/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Build with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          arguments: assembleDebug --no-daemon --stacktrace
          build-root-directory: android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: english-reading-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: English Reading v1.0.${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
