name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'css/**'
      - 'js/**'
      - 'index.html'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          ANDROID_HOME=$ANDROID_SDK_ROOT
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "=== Pre-installed SDK ==="
          ls $ANDROID_SDK_ROOT/platforms/ 2>/dev/null
          ls $ANDROID_SDK_ROOT/build-tools/ 2>/dev/null
          # Accept licenses
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          # Install platforms
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" 2>&1 || true
          echo "=== After install ==="
          ls $ANDROID_SDK_ROOT/platforms/ 2>/dev/null
          ls $ANDROID_SDK_ROOT/build-tools/ 2>/dev/null

      - name: Setup Gradle Wrapper
        working-directory: android
        run: |
          # Download Gradle, generate wrapper, then build
          curl -sSLo gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle.zip
          GRADLE_HOME=$PWD/gradle-8.11.1
          $GRADLE_HOME/bin/gradle wrapper --gradle-version 8.11.1
          # Set executable
          chmod +x gradlew
          echo "Wrapper generated"
          ./gradlew --version

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tail -200

      - name: Find APK
        run: find android -name "*.apk" -type f -ls

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-reading-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/**/*.apk

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: English Reading v1.0.${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
