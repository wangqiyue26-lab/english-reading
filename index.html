<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover, shrink-to-fit=no">
  <meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="English Reading">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <title>English Reading</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
</head>
<body>

  <!-- Top Navigation Bar -->
  <div class="top-bar" id="top-bar">
    <div style="display:flex;align-items:center;gap:8px;">
      <button class="btn-icon" id="btn-back" style="display:none">←</button>
      <h1 id="app-title">English Reading</h1>
    </div>
    <div class="top-bar-actions">
      <button class="btn-icon" id="btn-goal" style="display:none" title="Reading Goal">📊</button>
      <button class="btn-icon" id="btn-settings" title="Settings">⚙️</button>
    </div>
  </div>

  <!-- ====== SETTINGS MODAL ====== -->
  <div class="settings-overlay" id="settings-overlay">
    <div class="settings-modal">
      <div class="settings-sidebar">
        <div class="settings-sidebar-title" data-lang="settings">设置</div>
        <button class="settings-tab active" data-tab="system">🖥️ <span data-lang="tab_system">界面</span></button>
        <button class="settings-tab" data-tab="reader">📖 <span data-lang="tab_reader">阅读器</span></button>
        <button class="settings-tab" data-tab="learning">🎓 <span data-lang="tab_learning">学习辅助</span></button>
        <button class="settings-tab" data-tab="content">🔍 <span data-lang="tab_content">内容过滤</span></button>
        <div class="settings-sidebar-footer">
          <button class="settings-btn-secondary" id="btn-reset-settings" data-lang="reset">恢复默认</button>
        </div>
      </div>
      <div class="settings-content" id="settings-content"></div>
      <button class="settings-close" id="btn-close-settings">✕</button>
    </div>
  </div>

  <!-- ====== HOME PAGE ====== -->
  <div class="page active" id="home-page">
    <div class="home-page">
      <!-- Daily Goal Bar -->
      <div class="goal-bar" id="goal-bar" style="display:none">
        <div class="goal-bar-text"><span data-lang="today_read">今日已读</span>: <span id="goal-count">0</span>/<span id="goal-target">0</span> <span data-lang="articles">篇</span></div>
        <div class="goal-bar-fill"><div class="goal-bar-progress" id="goal-progress"></div></div>
      </div>

      <div class="section-title">📰 <span data-lang-key="journals">期刊</span></div>
      <div class="journal-grid" id="journal-grid"></div>

      <div class="section-title">📊 <span data-lang-key="difficulty">难度</span></div>
      <div class="difficulty-chips" id="difficulty-chips"></div>

      <div class="section-title">📄 <span data-lang-key="articles">文章列表</span></div>
      <div class="article-list" id="article-list"></div>
    </div>
  </div>

  <!-- ====== READER PAGE ====== -->
  <div class="page" id="reader-page">
    <div class="reader-page">
      <div class="reader-header">
        <div class="reader-journal" id="reader-journal"></div>
        <div class="reader-title" id="reader-title"></div>
        <div class="reader-meta" id="reader-meta"></div>
      </div>

      <!-- Progress bar -->
      <div class="reader-progress" id="reader-progress" style="display:none">
        <div class="reader-progress-bar"><div class="reader-progress-fill" id="reader-progress-fill"></div></div>
        <div class="reader-progress-text" id="reader-progress-text"></div>
      </div>

      <div class="toggle-bar">
        <button class="toggle-btn" id="btn-sentence-tr" onclick="Reader.toggleSentenceTranslation()">
          📖 <span data-lang-key="sentence_tr">逐句翻译</span>
        </button>
        <button class="toggle-btn" id="btn-full-tr" onclick="Reader.toggleFullTranslation()">
          📄 <span data-lang-key="full_tr">全文翻译</span>
        </button>
        <button class="toggle-btn" id="btn-ai-summary" onclick="Reader.toggleAISummary()" style="display:none">
          🤖 <span data-lang-key="ai_summary">AI 摘要</span>
        </button>
      </div>

      <!-- AI Summary area -->
      <div class="ai-summary" id="ai-summary" style="display:none"></div>

      <div class="article-content" id="article-content"></div>
    </div>
  </div>

  <!-- Word Popup -->
  <div class="word-popup" id="word-popup"></div>

  <!-- Reading Goal Toast -->
  <div class="goal-toast" id="goal-toast" style="display:none">
    <span>🎉</span> <span id="goal-toast-text"></span>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Scripts -->
  <script src="js/settings.js"></script>
  <script src="js/dictionary.js"></script>
  <script src="js/translator.js"></script>
  <script src="js/data.js"></script>
  <script src="js/reader.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>

</body>
</html>
